#######################################################################################################
# Monthly-mean MOM diagnostics only (plus optional static grid).
# Generated via COSIMA make_diag_table.py into a diag_table file for MOM diagnostics.
#######################################################################################################

global_defaults:
    title: ACCESS-OM3
    base_date: [ 1900, 1, 1, 0, 0, 0 ]

    # ---- FILE defaults ----
    # IMPORTANT CHANGE: removed "field_name" from filename so monthly output is ONE file per category.
    file_name:
        - file_name_prefix
        - file_name_dimension
        - file_name_diag_coord
        - output_freq
        - '':
            - output_freq_units
        - reduction_method
        - file_name_date

    output_freq: 1
    output_freq_units: months
    file_format: 1
    time_axis_units: days
    time_axis_name: time

    # one file per model-year (contains 12 monthly records)
    new_file_freq: 1
    new_file_freq_units: years

    start_time:
    file_duration:
    file_duration_units:

    # ---- FIELD defaults ----
    module_name: ocean_model
    field_name:
    output_name:
    time_sampling: all
    reduction_method: snap
    regional_section: none
    packing: 2

    # ---- filename helpers ----
    file_name_dimension: 3d
    file_name_prefix: access-om3.mom6
    file_name_date: "%4yr"
    file_name_separator: "."
    file_name_omit_empty: true
    file_name_substitutions:
        years: yr
        months: mon
        days: day
        hours: hr
        none: snap
        'False': snap
        average: mean
        'True': mean
        None: ""
    file_name_diag_coord: ""

diag_table:

    'static 2d grid data':
        defaults:
            file_name_dimension: static
            file_name:
                - file_name_prefix
                - file_name_dimension
            packing: 1
            reduction_method: snap
            output_freq: -1
            output_freq_units: months
            new_file_freq:
        fields:
            areacello:
            areacello_cu:
            areacello_cv:
            areacello_bu:
            dxt:
            dyt:
            geolat_c:
            geolat:
            geolat_u:
            geolat_v:
            geolon_c:
            geolon:
            geolon_u:
            geolon_v:
            deptho:
            wet:
            wet_c:
            wet_u:
            wet_v:
            Coriolis:
            sin_rot:
            cos_rot:
            dxCu:
            dyCu:
            dxCv:
            dyCv:
            dyCuo:
            dxCvo:

    # ------------------------
    # MONTHLY MEANS (keep only what you actually need)
    # ------------------------

    'monthly 3d fields on z':
        defaults:
            file_name_dimension: 3d
            reduction_method: mean
            module_name: ocean_model_z
            file_name_diag_coord: "z"
        fields:
            thkcello:
            agessc:
            rhopot0:
            rhopot2:
            thetao:
            so:
            uo:
            vo:
            KE:
            Kd_Itidal_Work:
            rsdoabsorb:

    'monthly 3d fields on native':
        defaults:
            file_name_dimension: 3d
            reduction_method: mean
            file_name_diag_coord: ""
        fields:
            e:
            thkcello:
            Kd_interface:
            Kd_ePBL:

    'monthly 2d fields':
        defaults:
            file_name_dimension: 2d
            reduction_method: mean
        fields:
            hfrunoffds:
            hfrainds:
            net_heat_coupler:
            hfds:
            wfo:
            pso:
            sfdsi:
            salt_flux_added:
            mlotst:
            speed:
            zos:
            zossq:
            tauuo:
            tauvo:
            umo_2d:
            vmo_2d:
            pbo:
            Chl_opac:
            SW_pen:
            T_adx_2d:
            T_ady_2d:
            T_diffx_2d:
            T_diffy_2d:
            T_hbd_diffx_2d:
            T_hbd_diffy_2d:
            friver:
            ficeberg:
            ePBL_h_ML:
            h_ML:
